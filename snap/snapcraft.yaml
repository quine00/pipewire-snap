name: pipewire
base: core24
adopt-info: pipewire
summary: Pipewire server, plus wireplumber and pipewire-pulse
description: |
  The pipewire video/audio daemon server.

grade: stable
confinement: strict

layout:
  /usr/share/pipewire:
    bind: $SNAP/usr/share/pipewire
  /usr/share/wireplumber:
    bind: $SNAP/usr/share/wireplumber
  /usr/share/spa-0.2:
    bind: $SNAP/usr/share/spa-0.2
  # NOTE(charles): Required to avoid,
  # Oct 16 06:55:01 gondor pipewire[31569]: pw.conf: execvp error '/usr/bin/wireplumber': No such file or directory
  # Might be better to adjust the configuration.
  # See also patch file for pipewire to exec this... Not documented.
  /usr/bin/wireplumber:
    symlink: $SNAP/usr/bin/wireplumber
  /usr/share/alsa:
    bind: $SNAP/usr/share/alsa
  /usr/share/alsa-card-profile:
    bind: $SNAP/usr/share/alsa-card-profile
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wireplumber-0.5:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/wireplumber-0.5
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib:
    symlink: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/alsa-lib
  /etc/alsa:
    bind: $SNAP/etc/alsa
  /etc/pulse:
    bind: $SNAP/etc/pulse
  /etc/pipewire:
    bind: $SNAP/etc/pipewire

environment:
  SPA_PLUGIN_DIR: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/spa-0.2
  LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}/usr/lib:/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pipewire-0.3:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pulseaudio

assumes:
  - snapd2.71 # for pipewire interface

apps:
  pipewire-bin:
    command: usr/bin/pipewire
    command-chain:
      - scripts/set-real-runtime-dir.sh
    daemon: simple
    restart-condition: never
    daemon-scope: user
    slots: &pwslots
      - pipewire
      - audio-playback
      - audio-record
      - pulseaudio
      - dbus-pipewire-telephony
      - dbus-wireplumber
      - dbus-pulseaudio
      - dbus-freedesktop-reservedevice1-audio0
      - dbus-freedesktop-reservedevice1-audio1
      - dbus-freedesktop-reservedevice1-audio2
      - dbus-freedesktop-reservedevice1-audio3
      - dbus-freedesktop-reservedevice1-audio4
      - dbus-freedesktop-reservedevice1-audio5
      - dbus-freedesktop-reservedevice1-audio6
      - dbus-freedesktop-reservedevice1-audio7
      - dbus-freedesktop-reservedevice1-audio8
      - dbus-freedesktop-reservedevice1-audio9
      - mpris
    plugs: &pwplugs
      - desktop
      - x11
      - alsa
      - bluez
      - camera
      - hardware-observe
      - media-control
      - network
      - network-bind
      - system-observe
      - modem-manager
  pipewire-pulse:
    command: usr/bin/pipewire-pulse
    command-chain:
      - scripts/set-real-runtime-dir.sh
    daemon: simple
    restart-condition: never
    daemon-scope: user
    slots: *pwslots
    plugs: *pwplugs

# apps for server-wide daemon
  pipewire-server-bin:
    command: usr/bin/pipewire
    daemon: simple
    restart-condition: never
    sockets:
      pipewire-socket:
        listen-stream: $SNAP_COMMON/pipewire-0
        socket-mode: 0644
    slots: *pwslots
    plugs: *pwplugs
    environment: &serverenviron
      PIPEWIRE_RUNTIME_DIR: $SNAP_COMMON
      PULSE_SERVER: $SNAP_COMMON

  pipewire-server-pulse:
    command: usr/bin/pipewire-pulse
    daemon: simple
    restart-condition: never
    sockets:
      pulse-socket:
        listen-stream: $SNAP_COMMON/pulse/native
        socket-mode: 0644
    slots: *pwslots
    plugs: *pwplugs
    environment: *serverenviron

slots:
  dbus-pipewire-telephony:
    interface: dbus
    name: org.pipewire.Telephony
    bus: session
  dbus-wireplumber:
    interface: dbus
    name: org.freedesktop.ReserveDevice1
    bus: session
  dbus-pulseaudio:
    interface: dbus
    name: org.pulseaudio.Server
    bus: session
  dbus-freedesktop-reservedevice1-audio0:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio0
  dbus-freedesktop-reservedevice1-audio1:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio1
  dbus-freedesktop-reservedevice1-audio2:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio2
  dbus-freedesktop-reservedevice1-audio3:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio3
  dbus-freedesktop-reservedevice1-audio4:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio4
  dbus-freedesktop-reservedevice1-audio5:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio5
  dbus-freedesktop-reservedevice1-audio6:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio6
  dbus-freedesktop-reservedevice1-audio7:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio7
  dbus-freedesktop-reservedevice1-audio8:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio8
  dbus-freedesktop-reservedevice1-audio9:
    interface: dbus
    bus: session
    name: org.freedesktop.ReserveDevice1.Audio9

parts:
  libcamera:
    plugin: meson
    source: https://git.libcamera.org/libcamera/libcamera.git
    source-type: git
    source-depth: 1
    source-tag: v0.7.0
    meson-parameters:
      - --prefix=/usr
      - -Dbuildtype=release
      - -Ddocumentation=disabled
      - -Dcam=disabled
      - -Dgstreamer=enabled
      - -Dlibunwind=enabled
      - -Dpycamera=disabled
      - -Dtracing=disabled
      - -Dlc-compliance=disabled
      - -Dtest=false
      - -Dv4l2=enabled
    build-packages:
      - libevent-dev
      - libgnutls28-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer1.0-dev
      # TODO: How to handle these architectures?
      #- libpisp-dev [arm64 armel armhf]
      - libtiff-dev
      - libudev-dev
      - libyaml-dev
      - libyuv-dev
      - openssl
      - pkgconf
      - python3-jinja2
      - python3-ply
      - python3-yaml
    stage-packages:
      - libudev1
      - libyaml-0-2
      - libyuv0

  pipewire:
    after: [libcamera]
    plugin: meson
    source: https://gitlab.freedesktop.org/pipewire/pipewire.git
    source-depth: 1
    source-tag: "1.6.2"
    source-type: git
    meson-parameters:
      - --prefix=/usr
      - -Daudiotestsrc=enabled
      - -Davahi=enabled
      - -Dbuildtype=release
      # TODO: Separate into a debugging snap? Useful while development is active
      #- -Ddebug=true
      - -Dbluez5-backend-native-mm=enabled
      - -Dbluez5-codec-aac=enabled
      - -Dbluez5-codec-aptx=enabled
      - -Dbluez5-codec-lc3=enabled
      # TODO: Package https://github.com/arkq/LC3plus/blob/master/src/floating_point/lc3plus.h ?
      - -Dbluez5-codec-lc3plus=disabled
      - -Dbluez5-codec-ldac=enabled
      - -Dbluez5-codec-opus=enabled
      # Force the wrap file to kick in. Notice we do *not* depend on the
      # Ubuntu libcamera packages, because libcamera is not a stable
      # interface, and thus perpetually out-of-date.
      - -Dlibcamera=enabled
      - -Dlibffado=enabled
      # TODO: Need a libroc newer than that which is offered in core24
      - -Droc=disabled
      - -Dsnap=enabled
      - -Dsystemd-user-service=enabled
      - -Dsystemd-system-service=enabled
      - -Dexamples=disabled
      - -Dman=disabled
      - -Dtests=disabled
      - -Dffmpeg=enabled
      - -Dvulkan=enabled
    override-pull: |
      craftctl default
      git_ver="$(git describe --tags)"
      echo $git_ver
      craftctl set version="${git_ver}"
      patch -p1 < $CRAFT_PROJECT_DIR/patches/launch-wireplumber.diff
      patch -p1 < $CRAFT_PROJECT_DIR/patches/0001-snap-policy-use-snapctl-for-all-audio-permission-che.patch
    build-packages:
      - dpkg-dev
      - debhelper-compat
      - graphviz
      - libapparmor-dev
      - libasound2-dev
      - libavahi-client-dev
      - libavcodec-dev
      - libavfilter-dev
      - libfdk-aac-dev
      - libvulkan-dev
      # TODO: Need to package libroc, core24 is too old
      #- libroc-dev
      - libbluetooth-dev
      - libdbus-1-dev
      - libffado-dev
      - libfreeaptx-dev
      - libglib2.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libgstreamer1.0-dev
      - libjack-jackd2-dev
      - libcanberra-dev
      - liblc3-dev
      - libldacbt-abr-dev
      - libldacbt-enc-dev
      - liblilv-dev
      - libmysofa-dev
      - libncurses-dev
      - libopus-dev
      - libpulse-dev
      - libreadline-dev
      - libroc-dev
      - libsbc-dev
      - libsdl2-dev
      - libsnapd-glib-dev
      - libsndfile1-dev
      - libssl-dev
      - libsystemd-dev
      - libudev-dev
      - libusb-1.0-0-dev
      - libv4l-dev
      - libwebrtc-audio-processing-dev
      - libxfixes-dev
      - meson
      - modemmanager-dev
      - pkgconf
      - python3-docutils
      - systemd-dev
    stage-packages:
      - libavcodec60
      - libavcodec-extra
      - libavfilter-extra
      - libavfilter-extra9
      - libavfilter9
      - libfdk-aac2
      # TODO: Need to package libroc, core24 is too old
      #- libroc0.3
      - libxfixes3
      - libcanberra0t64
      - libvorbisfile3
      - libpulse0
      - libffado2
      - liblilv-0-0
      - libvulkan1
      - libavahi-client3
      - libopusenc0
      - libopus0
      - libudev1
      - libsnapd-glib-2-1
      - libbluetooth3
      - libjson-glib-1.0-0
      - libnghttp2-14
      - libpsl5t64
      - libsoup-3.0-0
      - libwebrtc-audio-processing1
      - libasound2t64
      - libgstreamer-plugins-base1.0-0
      - libmysofa1
      - libldacbt-enc2
      - libsbc1
      - liblc3-1
      - libldacbt-abr2
      - libfreeaptx0
      - libfdk-aac2
      - libflac12t64
      - libmp3lame0
      - libmpg123-0t64
      - libogg0
      - libsndfile1
      - libvorbisenc2
      - libvorbis0a
      - libusb-1.0-0
      - psmisc
      - bluez-alsa-utils
      - yaru-theme-sound

    override-stage: |
      cp -a $CRAFT_PROJECT_DIR/scripts $CRAFT_PRIME/
      chmod 755 $CRAFT_PRIME/scripts/*
      craftctl default
    stage:
      - -usr/bin/meson
      - -usr/bin/ninja
      - -usr/lib/python3
      - -etc/pulse/client.conf.d/01-enable-autospawn.conf
      - -usr/share/doc
      - -usr/share/pkgconfig
      - -usr/share/upstart
      - -usr/share/man
      - -usr/share/session-migration
      - -usr/include
